<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC AR Card Viewer</title><style>
:root{--bg:#080b12;--panel:#111522;--line:#2b3347;--text:#f5f7fc;--muted:#929cb3;--accent:#8474ff;--good:#57e1ad;--bad:#ff7187}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#171b2b,#080b12 58%);color:var(--text);font-family:Inter,Pretendard,system-ui,sans-serif;min-height:100vh}.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:19px;font-weight:900}.badge{font-size:11px;color:#c2bcff;border:1px solid #514a80;border-radius:999px;padding:6px 10px}.grid{display:grid;grid-template-columns:315px 1fr;gap:16px}.panel{background:rgba(17,21,34,.94);border:1px solid var(--line);border-radius:18px;padding:14px}.step{padding:14px;border:1px solid #2a3144;border-radius:14px;margin-bottom:12px}.step h3{margin:0 0 7px;font-size:14px}.step p{margin:0 0 11px;color:var(--muted);font-size:12px;line-height:1.55}.drop{display:block;text-align:center;border:1px dashed #5c6680;border-radius:12px;padding:17px 10px;cursor:pointer;background:#0c101a}input{display:none}.status{font-size:11px;margin-top:9px;word-break:break-all;color:var(--muted)}.ok{color:var(--good)}.err{color:var(--bad)}button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;background:var(--accent);color:white;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.camera{position:relative;min-height:670px;overflow:hidden;padding:0;background:#05070b}.camhead{position:absolute;z-index:20;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em}.live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff526b;margin-right:7px}.stage{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#111622,#080a10);perspective:1100px}.card{position:relative;width:min(82%,760px);aspect-ratio:16/9;transform:rotateX(3deg) rotateY(-4deg);filter:drop-shadow(0 24px 30px #000a)}.card img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}.arvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;z-index:4;background:transparent;display:none}.playing .arvideo{display:block}.vfxvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;pointer-events:none;opacity:0;mix-blend-mode:screen;transform:translate(5.5%,1.8%) scale(2.52);transform-origin:center}.vfxOn .vfxvideo{opacity:.66}.replay{position:absolute;z-index:40;left:50%;bottom:42px;transform:translateX(-50%);width:auto;min-width:180px;padding:13px 24px;border:1px solid #ffffff33;background:#0a0d14e8;border-radius:999px;display:none}.replay.show{display:block}.corners{position:absolute;inset:-10px;opacity:0}.found .corners{opacity:1}.corners i{position:absolute;width:35px;height:35px;border-color:#8dffcf;border-style:solid}.corners i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}.corners i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}.corners i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}.corners i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}.msg{position:absolute;z-index:8;bottom:50px;left:50%;transform:translateX(-50%);padding:9px 15px;border:1px solid #ffffff22;background:#05070bd9;border-radius:999px;font-size:12px}.scan{display:none;position:absolute;z-index:7;left:24%;right:24%;height:1px;background:#8dffcf;box-shadow:0 0 12px #8dffcf;animation:scan 1.2s linear infinite}.scanning .scan{display:block}@keyframes scan{0%{top:25%}100%{top:75%}}.empty{text-align:center;color:#7d879e}.preview{max-width:76px;max-height:76px;border-radius:7px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.camera{min-height:560px}}.grid{grid-template-columns:300px minmax(0,1fr);align-items:start}.camera{order:2;width:100%;min-height:min(78vh,900px);aspect-ratio:16/9}.grid>section:first-child{order:1;display:block}.grid>section:first-child .step{margin-bottom:12px}.grid>section:first-child>button{position:sticky;bottom:12px;z-index:30;font-size:15px;padding:16px}.camera .card{width:min(88%,1100px)}@media(max-width:800px){.grid{grid-template-columns:1fr}.camera{order:1;min-height:56vh;aspect-ratio:auto}.grid>section:first-child{order:2}} </style></head><body><main class="app"><div class="top"><div class="brand">PC AR CARD VIEWER</div><div class="badge">v2.1 · Left Sidebar</div></div><div class="grid"><section class="panel"><div class="step"><h3>1. QR 이미지 불러오기</h3><p>카메라 대신 QR 이미지 파일을 선택합니다.</p><label class="drop">QR 이미지 선택<input id="qr" type="file" accept="image/*"></label><div id="qs" class="status">QR을 선택해 주세요.</div><img id="qp" class="preview" hidden></div><div class="step"><h3>2. 카드 이미지 불러오기</h3><p>PC 화면에서 가상 카메라가 인식할 카드 이미지를 선택합니다.</p><label class="drop">카드 이미지 선택<input id="ci" type="file" accept="image/*"></label><div id="cs" class="status">카드 이미지를 선택해 주세요.</div></div><button id="go" disabled>가상 AR 카메라 실행</button></section><section class="panel camera"><div class="camhead"><span class="live">AR CAMERA</span><span>PC · LIVE</span></div><div id="stage" class="stage"><div id="empty" class="empty">QR과 카드 이미지를 불러오면<br>가상 AR 카메라가 표시됩니다.</div><div id="card" class="card" hidden><img id="cardimg"><video id="mainvideo" class="arvideo" playsinline preload="auto" src="https://ggom-ar-card.vercel.app/assets/main.mp4"></video><video id="vfxvideo" class="vfxvideo" muted playsinline preload="auto" src="https://ggom-ar-card.vercel.app/assets/vfx-original.mp4"></video><div class="corners"><i></i><i></i><i></i><i></i></div></div><div class="scan"></div><div id="msg" class="msg" hidden>READY</div><button id="replay" class="replay">↻ 다시 보기</button></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
let q=false,c=false,vfxStarted=false,raf=0;const $=s=>document.querySelector(s);function ready(){$('#go').disabled=!(q&&c)}async function decode(f){const b=await createImageBitmap(f),cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});cv.width=b.width;cv.height=b.height;x.drawImage(b,0,0);if('BarcodeDetector'in window){try{const d=new BarcodeDetector({formats:['qr_code']}),r=await d.detect(cv);if(r[0]?.rawValue)return r[0].rawValue}catch(e){}}const im=x.getImageData(0,0,cv.width,cv.height),z=window.jsQR&&jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});if(z?.data)return z.data;throw Error('QR을 인식하지 못했습니다.')}$('#qr').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#qp').src=URL.createObjectURL(f);$('#qp').hidden=false;$('#qs').textContent='QR 분석 중...';try{const t=await decode(f);q=true;$('#qs').className='status ok';$('#qs').textContent='✓ QR 인식: '+t}catch(err){q=false;$('#qs').className='status err';$('#qs').textContent=err.message}ready()};$('#ci').onchange=e=>{const f=e.target.files[0];if(!f)return;$('#cardimg').src=URL.createObjectURL(f);$('#card').hidden=false;$('#empty').hidden=true;c=true;$('#cs').className='status ok';$('#cs').textContent='✓ 카드 이미지 준비 완료';ready()};$('#go').onclick=async()=>{const cam=document.querySelector('.camera');try{if(!document.fullscreenElement&&cam.requestFullscreen)await cam.requestFullscreen()}catch(e){}const s=$('#stage'),m=$('#msg'),v=$('#mainvideo'),fx=$('#vfxvideo'),card=$('#card');s.classList.remove('found');card.classList.remove('playing','vfxOn');$('#replay').classList.remove('show');vfxStarted=false;cancelAnimationFrame(raf);fx.pause();try{fx.currentTime=4.18}catch(e){}s.classList.add('scanning');m.hidden=false;m.textContent='SCANNING CARD...';try{v.currentTime=0;v.muted=false;await v.play();v.pause();v.currentTime=0}catch(e){}setTimeout(async()=>{s.classList.remove('scanning');s.classList.add('found');m.textContent='TARGET FOUND ✓';card.classList.add('playing');try{v.currentTime=0;await v.play();m.textContent='AR VIDEO PLAYING ▶';setTimeout(()=>m.hidden=true,900);const sync=()=>{if(!vfxStarted&&v.currentTime>=3.28){vfxStarted=true;card.classList.add('vfxOn');try{fx.currentTime=4.18}catch(e){}fx.play().catch(()=>{})}if(!v.paused&&!v.ended)raf=requestAnimationFrame(sync)};raf=requestAnimationFrame(sync)}catch(e){m.textContent='영상 재생 실패 · 다시 실행 버튼을 눌러주세요';m.className='msg err';}},900)};async function replayAR(){const v=$('#mainvideo'),fx=$('#vfxvideo'),card=$('#card'),m=$('#msg');cancelAnimationFrame(raf);vfxStarted=false;fx.pause();card.classList.remove('vfxOn');$('#replay').classList.remove('show');try{v.currentTime=0;fx.currentTime=4.18;card.classList.add('playing');m.hidden=true;await v.play();const sync=()=>{if(!vfxStarted&&v.currentTime>=3.28){vfxStarted=true;card.classList.add('vfxOn');try{fx.currentTime=4.18}catch(e){}fx.play().catch(()=>{})}if(!v.paused&&!v.ended)raf=requestAnimationFrame(sync)};raf=requestAnimationFrame(sync)}catch(e){m.hidden=false;m.textContent='재생 실패 · 다시 보기 버튼을 눌러주세요';$('#replay').classList.add('show')}}$('#replay').onclick=replayAR;$('#mainvideo').onended=()=>{cancelAnimationFrame(raf);$('#vfxvideo').pause();$('#card').classList.remove('playing','vfxOn');$('#msg').hidden=false;$('#msg').className='msg';$('#msg').textContent='PLAYBACK COMPLETE';$('#replay').classList.add('show')};document.addEventListener('fullscreenchange',()=>{const cam=document.querySelector('.camera');if(document.fullscreenElement===cam){cam.style.minHeight='100vh';cam.style.width='100vw';cam.style.borderRadius='0'}else{cam.style.minHeight='';cam.style.width='';cam.style.borderRadius=''}});</script></body></html>
